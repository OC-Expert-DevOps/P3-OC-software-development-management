openapi: 3.0.3
info:
  title: DataShare API
  description: |
    Secure file transfer platform API for freelancers and small businesses.
    Enables file upload (authenticated or anonymous), temporary download link
    generation, tag/password management and file history.
  version: 1.0.0
  contact:
    name: DataShare Team

servers:
  - url: https://localhost/api
    description: Local Docker Compose (via Nginx reverse proxy)

tags:
  - name: Health
    description: Infrastructure health check
  - name: Auth
    description: User registration, login, logout, token refresh
  - name: Files
    description: File upload, listing, metadata, deletion, password and tags
  - name: Download Links
    description: Authenticated management of shareable download links (implements the link-generation part of US01, as a separate explicit step)
  - name: Download
    description: Public download via temporary links

# ──────────────────────────────────────────────
# Security Schemes
# ──────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15min TTL by default, see JWT_EXPIRES_IN)

  parameters:
    FileId:
      in: path
      name: fileId
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # ── Error ──
    # Default shape produced by NestJS's built-in HttpException handling
    # (no custom exception filter is registered in this project).
    Error:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          description: Single message, or an array of messages for class-validator errors
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: File not found
        error:
          type: string
          example: Not Found

    # ── Auth ──
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        name:
          type: string
          description: Optional display name. Accepted but NOT persisted yet (no column on User).
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          description: >-
            Min 8 characters, must contain at least one uppercase letter, one
            lowercase letter and one special character.
          minLength: 8
          example: MyP@ssw0rd

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: MyP@ssw0rd

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    AuthResponse:
      description: >-
        Returned by register, login and refresh. The refresh token itself is
        NOT in this body — it is set as an HttpOnly cookie (`refresh_token`,
        path `/api/auth`, 7 days).
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserSummary"

    # ── Files ──
    FileResponse:
      description: >-
        Shape of the `File` Prisma model as returned by the API. `passwordHash`
        is stripped server-side and replaced by the `hasPassword` boolean —
        the raw hash is never sent to the client.
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
          description: null for anonymously-uploaded files
        originalName:
          type: string
          example: report-q4.pdf
        storageKey:
          type: string
          example: 3f6e.../a1b2c3d4-report-q4.pdf
        mimeType:
          type: string
          nullable: true
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          description: >-
            Serialized as a JSON number here (BigInt → Number via the global
            patch in main.ts). Note: some other endpoints (list, download info)
            serialize the same field as a string instead — not yet harmonized.
          example: 2048576
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        isDeleted:
          type: boolean
        hasPassword:
          type: boolean

    FileListItem:
      description: Shape returned by GET /files (deliberately excludes passwordHash).
      type: object
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
          example: report-q4.pdf
        storageKey:
          type: string
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: string
          description: Serialized as a string here (`.toString()` in the service).
          example: "2048576"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        hasPassword:
          type: boolean

    FileStatsResponse:
      type: object
      properties:
        totalFiles:
          type: integer
        activeFiles:
          type: integer
        expiredFiles:
          type: integer
        totalSizeBytes:
          type: string
          example: "10485760"

    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 4
          example: s3cr3t

    ManageTagsRequest:
      description: Replaces the full set of tags on the file (not additive).
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
          example: ["design", "client-x"]

    TagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          example: ["design", "client-x"]

    DownloadHistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        downloadedAt:
          type: string
          format: date-time
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        tokenId:
          type: string
          format: uuid
          nullable: true

    # ── Download links (extension of US01) ──
    CreateLinkRequest:
      type: object
      properties:
        ttlSeconds:
          type: integer
          minimum: 60
          description: Defaults to DOWNLOAD_LINK_TTL_SECONDS (86400s / 24h).
          example: 86400
        maxDownloads:
          type: integer
          minimum: 0
          description: 0 or omitted = unlimited downloads.
          example: 5

    DownloadTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        token:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        downloadCount:
          type: integer
        maxDownloads:
          type: integer
        createdAt:
          type: string
          format: date-time

    # ── Public download ──
    DownloadInfoResponse:
      type: object
      properties:
        originalName:
          type: string
          example: report-q4.pdf
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: string
          example: "2048576"
        hasPassword:
          type: boolean

# ──────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────
paths:
  # ════════════════════════════════════════════
  # HEALTH
  # ════════════════════════════════════════════
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  # ════════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (US03)
      description: Create a new user account with email and password. Logs the user in immediately.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created, access token returned, refresh token set as cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error (invalid email format, password policy not met)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user (US04)
      description: |
        Authenticate with email + password. Returns a JWT access token in the response body
        and sets an HttpOnly refresh token cookie.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie (7 days)
              schema:
                type: string
                example: refresh_token=<uuid>; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      description: Revoke the current refresh token (looked up from the cookie) and clear the cookie.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Logout successful
        "401":
          description: Not authenticated (missing/invalid access token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Use the HttpOnly refresh token cookie to obtain a new access token.
        The old refresh token is revoked and a new one is issued (rotation).
      operationId: refreshToken
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New access token issued
          headers:
            Set-Cookie:
              description: New HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Missing, invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ════════════════════════════════════════════
  # FILES
  # ════════════════════════════════════════════
  /files/upload:
    post:
      tags: [Files]
      summary: Upload a file (US01)
      description: |
        Upload a file with multipart/form-data. Does NOT create a download link —
        call POST /files/{id}/links afterwards to generate one.
      operationId: uploadFile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (max MAX_FILE_SIZE_BYTES, default 1 GB)
                expiryDays:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 7
                  description: Expiration in days (defaults to FILE_EXPIRY_DAYS_DEFAULT)
                password:
                  type: string
                  description: Optional password protecting the file at upload time (US09)
      responses:
        "201":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "400":
          description: Validation error (no file, file too large, forbidden extension)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/anonymous:
    post:
      tags: [Files]
      summary: Upload a file anonymously (US07)
      description: |
        Upload a file without authentication. Not linked to any user account,
        cannot be listed or managed afterwards, fixed 24h expiration.
      operationId: uploadFileAnonymous
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (max MAX_FILE_SIZE_BYTES, default 1 GB)
      responses:
        "201":
          description: File uploaded successfully (anonymous, expires in 24h)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "400":
          description: Validation error (no file, file too large, forbidden extension)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/stats:
    get:
      tags: [Files]
      summary: Aggregate file statistics for the authenticated user (US06)
      operationId: getFileStats
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStatsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files:
    get:
      tags: [Files]
      summary: List user's files (US05)
      description: >-
        Returns all non-deleted files owned by the authenticated user, newest first.
        No pagination, sorting or tag-filtering query parameters are implemented yet.
      operationId: listFiles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of user's files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileListItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{fileId}:
    get:
      tags: [Files]
      summary: Get file metadata
      operationId: getFileMetadata
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Files]
      summary: Delete a file (US06)
      description: |
        Soft-deletes the file, removes the object from MinIO storage, and
        invalidates all its download tokens. Only the file owner can delete.
      operationId: deleteFile
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "204":
          description: File deleted successfully
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{fileId}/password:
    put:
      tags: [Files]
      summary: Set or replace a file's password (US09)
      operationId: setFilePassword
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "200":
          description: Password set
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password set
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Files]
      summary: Remove a file's password (US09)
      operationId: removeFilePassword
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "204":
          description: Password removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{fileId}/tags:
    put:
      tags: [Files]
      summary: Replace a file's tags (US08)
      description: Replaces the full set of tags on the file (not additive).
      operationId: setFileTags
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManageTagsRequest"
      responses:
        "200":
          description: Tags updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [Files]
      summary: Get a file's tags (US08)
      operationId: getFileTags
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Tags for this file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{fileId}/history:
    get:
      tags: [Files]
      summary: Get a file's per-download history log (extra feature, not one of the 10 official user stories)
      operationId: getFileHistory
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Download history entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadHistoryEntry"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ════════════════════════════════════════════
  # DOWNLOAD LINKS (extension of US01, authenticated)
  # ════════════════════════════════════════════
  /files/{fileId}/links:
    post:
      tags: [Download Links]
      summary: Create a shareable download link for a file
      operationId: createDownloadLink
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Download link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTokenResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [Download Links]
      summary: List active (non-expired) download links for a file
      operationId: listDownloadLinks
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Active download links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadTokenResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{fileId}/links/{tokenId}:
    delete:
      tags: [Download Links]
      summary: Revoke a download link
      description: Sets the token's expiresAt to now, making it immediately unusable.
      operationId: revokeDownloadLink
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - in: path
          name: tokenId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Link revoked
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the file owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File or token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ════════════════════════════════════════════
  # DOWNLOAD (PUBLIC)
  # ════════════════════════════════════════════
  /download/{token}/info:
    get:
      tags: [Download]
      summary: Get download link info (US02)
      description: |
        Returns file metadata before download. Public endpoint — no authentication required.
        Shows original filename, MIME type, size, and whether a password is required.
      operationId: getDownloadInfo
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            format: uuid
          description: Unique download token (UUID v4)
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadInfoResponse"
        "404":
          description: Token not found, or the underlying file was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Link expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /download/{token}:
    get:
      tags: [Download]
      summary: Download a file (US02)
      description: |
        Streams the file directly from the backend (proxied from MinIO — not a
        redirect). Public endpoint. If the file is password-protected (US09),
        the password must be provided as a query parameter.
      operationId: downloadFile
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            format: uuid
          description: Unique download token (UUID v4)
        - in: query
          name: password
          required: false
          schema:
            type: string
          description: File password (required if the file is password-protected)
      responses:
        "200":
          description: File content, streamed with Content-Disposition attachment headers
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Password required, or incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Token not found, or the underlying file was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Link expired, or download limit (maxDownloads) reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
